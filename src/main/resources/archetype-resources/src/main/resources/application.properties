#set( $symbol_dollar = '$' )
spring.application.name=${artifactId}

logging.level.root=INFO
logging.level.${groupId}=${symbol_dollar}{LOG_NIVEL:INFO}

spring.datasource.url=jdbc:oracle:thin:@dbfullstack3_tp?TNS_ADMIN=/Wallet_dbfullstack3
spring.datasource.username=${esquema}
spring.datasource.password=${symbol_dollar}{DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

server.port=${puerto}

management.endpoints.web.exposure.include=health,info

jwt.secreto=${symbol_dollar}{JWT_SECRETO}

cors.origen=${symbol_dollar}{CORS_ORIGEN:http://localhost:4200}
